name: Refresh profile graphics

on:
  schedule:
    # every 6 hours - third-party cards were a day stale, these should not be
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%232f5fe0&color_dots=%23e8e1d2,%239bc3e7,%238fd6e3,%232f5fe0,%23141020
            dist/snake-dark.svg?color_snake=%238fd6e3&color_dots=%23161b22,%231f3a6e,%232f5fe0,%239bc3e7,%238fd6e3

      # Platane/snk runs in Docker as root, so dist/ comes back root-owned and
      # the next step cannot write into it.
      - name: Take ownership of dist
        run: sudo chown -R "$(id -u):$(id -g)" dist && ls -la dist

      - name: Build contribution stats card
        env:
          PROFILE_USER: ${{ github.repository_owner }}
          STATS_OUT: dist/stats.svg
        run: python3 .github/scripts/build_stats.py

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
