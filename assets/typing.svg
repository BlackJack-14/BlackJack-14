    </rect>
  </clipPath>
  <clipPath id="clip2">
    <rect x="34.4" y="0" height="42" width="0">
      <animate attributeName="width" values="0;0;234.6;234.6;0;0"
               keyTimes="0.0000;0.6667;0.7792;0.9500;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"
