             keyTimes="0.0000;0.0000;0.1125;0.2833;0.3333;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0000;0.3333;1"
             dur="12.0s" repeatCount="indefinite"/>
  </rect>
  <rect y="14" width="9" height="17" class="caret" x="34.4">
    <animate attributeName="x" values="34.4;34.4;289.4;289.4;34.4;34.4"
             keyTimes="0.0000;0.3333;0.4458;0.6167;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3333;0.6667;1"
             dur="12.0s" repeatCount="indefinite"/>
  </rect>
  <rect y="14" width="9" height="17" class="caret" x="34.4">
    <animate attributeName="x" values="34.4;34.4;269.0;269.0;34.4;34.4"
             keyTimes="0.0000;0.6667;0.7792;0.9500;1.0000;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.6667;1.0000;1"
             dur="12.0s" repeatCount="indefinite"/>
  </rect>
</g>
<defs>
  <clipPath id="clip0">
    <rect x="34.4" y="0" height="42" width="0">
      <animate attributeName="width" values="0;0;244.8;244.8;0;0"
