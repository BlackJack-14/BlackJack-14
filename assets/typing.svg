<svg xmlns="http://www.w3.org/2000/svg" width="640" height="42" viewBox="0 0 640 42" role="img"
     aria-label="Terminal typing: fine-tuning the model, retrieval looks grounded, shipping to production">
<style>
  .t { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 17px; fill: #1f2328; }
  .p { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 17px; fill: #2f5fe0; font-weight: 700; }
  .caret { fill: #2f5fe0; }
  .blink { animation: b 1s steps(1) infinite; }
