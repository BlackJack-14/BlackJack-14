               calcMode="linear"/>
    </rect>
  </clipPath>
  <clipPath id="clip1">
    <rect x="34.4" y="0" height="42" width="0">
      <animate attributeName="width" values="0;0;255.0;255.0;0;0"
               keyTimes="0.0000;0.3333;0.4458;0.6167;0.6667;1.0000" dur="12.0s" repeatCount="indefinite"
